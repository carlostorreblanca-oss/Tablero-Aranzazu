<title>Tablero Aranzazu Móvil</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: lienzo fijo 1920×1080 escalado a la pantalla. Encabezado / 3 columnas (Seguridad · Fotos+Resultados · RH) / cintilla. */
:root{
  /* Tema activo (lo reescribe el script según el tema del mes) */
  --t-bg:#0F172A; --t-surf:#162238; --t-surf2:#1D2B45; --t-line:#334155;
  --acc:#D4AF37; --acc2:#F59E0B; --deep:#B45309; --inkL:#7A5C0C;
  --acc-soft:rgba(212,175,55,.14); --acc-glow:rgba(212,175,55,.38); --deep-soft:rgba(180,83,9,.30);
  --stripe:linear-gradient(90deg,#D4AF37 0%,#F59E0B 55%,#B45309 100%);
  /* Semánticos */
  --ok:#22C55E; --warn:#F5B60B; --bad:#EF4444;
  --ok-soft:rgba(34,197,94,.16); --warn-soft:rgba(245,182,11,.18); --bad-soft:rgba(239,68,68,.18);
  --housing:#070A10; --on-acc:#0F172A; --photo-ink:#FFFFFF;
  /* Modo oscuro industrial (predeterminado) */
  --bg:var(--t-bg); --surface:var(--t-surf); --surface-2:var(--t-surf2); --line:var(--t-line);
  --fg:#F1F5F9; --muted:#A3B1C6; --faint:#6B7A90; --ink:var(--acc); --ink2:var(--acc2);
  --ok-ink:#4ADE80; --warn-ink:#FBBF24; --bad-ink:#F87171;
  --shadow:none;
  /* Tipografía */
  --f-display:"Big Shoulders Display","Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --s:1;
  color-scheme:dark;
}
:root[data-mode="light"]{
  --bg:#E8ECF1; --surface:#FFFFFF; --surface-2:#F2F4F7; --line:#D2D9E2;
  --fg:#0F172A; --muted:#46546A; --faint:#7B8798; --ink:var(--inkL); --ink2:var(--deep);
  --ok-ink:#15803D; --warn-ink:#A16207; --bad-ink:#B91C1C;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 10px 28px rgba(15,23,42,.07);
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--f-body)}
#app{height:100%}
*{box-sizing:border-box}
body.idle,body.idle *{cursor:none!important}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc2);outline-offset:3px}

.viewport{height:100%;display:flex;align-items:center;justify-content:center;padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage-box{position:relative;flex:none;width:calc(1920px * var(--s));height:calc(1080px * var(--s));max-width:100%}
.stage{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:0 0;
  display:grid;grid-template-rows:112px minmax(0,1fr) 64px;background:var(--bg);overflow:hidden}

/* ---------- Encabezado ---------- */
.hdr{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:36px;padding:0 40px;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:5px;background:var(--stripe)}
.brand{display:grid;grid-template-columns:auto auto auto;align-items:center;column-gap:22px}
.brand .logo{display:block;height:64px;width:auto;max-width:100%}
.wordmark{display:grid;row-gap:2px}
.wordmark b{font:800 48px/0.9 var(--f-display);letter-spacing:.01em;color:var(--fg)}
.wordmark b span{color:var(--ink)}
.wordmark small{font:600 13px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.vrule{width:1px;height:56px;background:var(--line);margin-left:8px}
.unit{display:grid;row-gap:4px}
.unit b{font:700 30px/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase}
.unit small{font:500 17px/1 var(--f-body);color:var(--muted)}
.hdr-mid{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 20px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);font:600 19px/1 var(--f-body);white-space:nowrap}
.chip .ico{color:var(--ink)}
.chip.theme{border-color:var(--acc);background:var(--acc-soft)}
.chip.demo{border-style:dashed;color:var(--muted);font-size:16px;height:38px;padding:0 14px}
.chip.demo .ico{color:var(--warn-ink)}
.clock{text-align:right;display:grid;row-gap:6px;justify-items:end}
.clock .time{font:800 64px/0.85 var(--f-display);letter-spacing:.01em;font-variant-numeric:tabular-nums;color:var(--fg)}
.clock .time .sec{color:var(--ink);font-size:44px;margin-left:4px}
.clock .date{font:600 21px/1 var(--f-body)}
.clock .loc{font:500 16px/1 var(--f-body);color:var(--muted);display:flex;align-items:center;gap:6px}

/* ---------- Cuerpo ---------- */
.main{display:grid;grid-template-columns:520px minmax(0,1fr) 500px;column-gap:24px;padding:24px 32px;min-height:0}
.col{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);row-gap:24px;min-height:0;min-width:0}
.col.mid{grid-template-rows:466px minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);min-height:0;min-width:0;overflow:hidden;position:relative}
.eyebrow{display:flex;align-items:center;gap:10px;font:700 17px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.eyebrow .ico{color:var(--ink)}
.eyebrow .count{margin-left:auto;letter-spacing:.04em;color:var(--faint);font-weight:600}
.bar{position:relative;height:14px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:linear-gradient(90deg,var(--deep),var(--acc));width:0;transition:width 1.4s cubic-bezier(.2,.7,.2,1)}
.bar.ok i{background:linear-gradient(90deg,#15803D,var(--ok))}
.bar.warn i{background:linear-gradient(90deg,#B45309,var(--warn))}
.bar.bad i{background:linear-gradient(90deg,#991B1B,var(--bad))}
.bar .pace{position:absolute;top:-7px;bottom:-7px;width:3px;margin-left:-1.5px;background:var(--fg);border-radius:2px}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;font:700 19px/1 var(--f-body);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok-ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn-ink)}
.pill.bad{background:var(--bad-soft);color:var(--bad-ink)}

/* ---------- Seguridad ---------- */
.safety{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto}
.counter{padding:26px 32px 24px;display:grid;grid-template-columns:minmax(0,1fr);row-gap:12px;background:radial-gradient(120% 80% at 0% 0%,var(--acc-soft),transparent 60%)}
.counter .big{display:flex;align-items:flex-end;gap:16px;min-width:0}
.counter .big b{font:900 220px/0.78 var(--f-display);letter-spacing:-.01em;color:var(--ink);font-variant-numeric:tabular-nums}
.counter .big span{font:800 36px/0.95 var(--f-display);letter-spacing:.02em;padding-bottom:6px}
.counter .lbl{font:600 21px/1.25 var(--f-body);color:var(--fg)}
.record{display:grid;row-gap:8px;margin-top:4px}
.record .row{display:flex;justify-content:space-between;gap:12px;white-space:nowrap;font:600 17px/1 var(--f-body);color:var(--muted)}
.record .row b{color:var(--fg)}
.ccrm{padding:18px 32px;border-top:1px solid var(--line);display:grid;row-gap:14px}
.ccrm-body{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:24px;align-items:center}
.semaforo{background:var(--housing);border-radius:16px;padding:10px;display:grid;row-gap:8px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.06)}
.semaforo i{display:block;width:34px;height:34px;border-radius:50%;opacity:.16}
.semaforo i.r{background:#EF4444}.semaforo i.y{background:#F5B60B}.semaforo i.g{background:#22C55E}
.semaforo i.on{opacity:1}
.semaforo i.r.on{box-shadow:0 0 18px 4px rgba(239,68,68,.65)}
.semaforo i.y.on{box-shadow:0 0 18px 4px rgba(245,182,11,.6)}
.semaforo i.g.on{box-shadow:0 0 18px 4px rgba(34,197,94,.6)}
.ccrm-num{display:grid;row-gap:8px}
.ccrm-num .pct{display:flex;align-items:baseline;gap:12px}
.ccrm-num .pct b{font:800 84px/0.8 var(--f-display);font-variant-numeric:tabular-nums}
.ccrm-num .pct em{font:700 18px/1 var(--f-body);font-style:normal;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.ccrm-num .pct em.ok{color:var(--ok-ink)}.ccrm-num .pct em.warn{color:var(--warn-ink)}.ccrm-num .pct em.bad{color:var(--bad-ink)}
.ccrm-num p{margin:0;font:500 18px/1.3 var(--f-body);color:var(--muted)}
.ccrm-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:6px;overflow:hidden}
.ccrm-stats div{padding:10px 14px;display:grid;row-gap:4px;background:var(--surface-2)}
.ccrm-stats div+div{border-left:1px solid var(--line)}
.ccrm-stats b{font:800 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.ccrm-stats span{font:600 14px/1.15 var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.regla{border-top:1px solid var(--line);display:grid;grid-template-rows:12px minmax(0,1fr);min-height:0}
.tape{background:repeating-linear-gradient(135deg,#F5B60B 0 16px,#111318 16px 32px)}
.regla-in{padding:16px 32px 18px;display:grid;grid-template-columns:64px minmax(0,1fr);column-gap:20px;align-content:center;min-height:0}
.regla-ico{width:64px;height:64px;border-radius:8px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center}
.regla-txt{display:grid;row-gap:10px;align-content:center;min-width:0}
.regla-txt small{font:700 16px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.regla-txt p{margin:0;font:600 25px/1.22 var(--f-body);text-wrap:balance}

/* ---------- Carrusel ---------- */
.carousel{background:#0A0E16}
.slide{position:absolute;top:0;left:0;right:0;bottom:0;opacity:0;transition:opacity 1.1s ease}
.slide.on{opacity:1;z-index:2}
.slide.prev{z-index:1}
.media{position:absolute;top:0;left:0;right:0;bottom:0;transform-origin:60% 40%}
.slide.on .media,.slide.prev .media{animation:kb var(--kb,11s) linear forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08)}}
.media img{width:100%;height:100%;object-fit:cover;display:block;max-width:100%;background:#0A0E16}
.ph{position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(90% 90% at 88% 8%,var(--acc-glow),transparent 62%),radial-gradient(70% 70% at 0% 100%,var(--deep-soft),transparent 70%),linear-gradient(160deg,#1B2536 0%,#0A0E16 78%)}
.ph::before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(-14deg,rgba(255,255,255,.045) 0 2px,transparent 2px 38px),repeating-linear-gradient(-9deg,rgba(255,255,255,.03) 0 1px,transparent 1px 23px)}
.ph .ph-ico{position:absolute;right:64px;top:44px;color:rgba(255,255,255,.2)}
.cap{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:90px 36px 28px;background:linear-gradient(180deg,rgba(5,8,14,0),rgba(5,8,14,.86) 55%);color:var(--photo-ink);display:grid;row-gap:12px}
.cap-top{display:flex;align-items:center;gap:14px}
.cat{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:4px;background:var(--acc);color:var(--on-acc);font:700 16px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase}
.cap-top time{font:600 19px/1.2 var(--f-body);color:rgba(255,255,255,.82);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap-top .cnt{margin-left:auto;flex:none;font:600 15px/1 var(--f-body);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:6px 10px}
.cap h3{margin:0;font:800 46px/1 var(--f-display);letter-spacing:.005em;text-wrap:balance}
.cap p{margin:0;font:500 21px/1.3 var(--f-body);color:rgba(255,255,255,.86);max-width:680px}
.segs{position:absolute;top:22px;left:36px;right:36px;z-index:4;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;column-gap:8px}
.segs span{height:5px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
.segs span.done{background:rgba(255,255,255,.8)}
.segs span i{display:block;height:100%;width:0;background:var(--acc)}
.segs span.cur i{animation:seg var(--iv,10s) linear forwards}
@keyframes seg{from{width:0}to{width:100%}}
.car-count{position:absolute;top:40px;right:36px;z-index:4;font:700 15px/1 var(--f-body);color:rgba(255,255,255,.78);letter-spacing:.06em}
.car-tag{position:absolute;top:44px;left:36px;z-index:4;display:flex;align-items:center;gap:8px;font:700 15px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.78)}

/* ---------- Resultados ---------- */
.results{padding:22px 28px 24px;display:grid;grid-template-rows:auto minmax(0,1fr);row-gap:16px}
.res-head{display:flex;align-items:center;gap:14px}
.res-head .eyebrow{flex:1}
.res-head .corte{font:600 16px/1 var(--f-body);color:var(--faint)}
.res-grid{display:grid;grid-template-columns:minmax(0,1fr) 1px minmax(0,1fr);column-gap:26px;min-height:0}
.res-grid .sep{background:var(--line)}
.res-col{display:grid;align-content:start;row-gap:14px;min-width:0}
.res-col h4{margin:0;font:700 22px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.kpi{display:grid;row-gap:8px}
.kpi-top{display:flex;align-items:center;gap:10px;font:600 17px/1 var(--f-body);color:var(--muted)}
.kpi-top .ico{color:var(--ink)}
.kpi-val{display:flex;align-items:baseline;gap:10px;min-width:0}
.kpi-val b{font:800 50px/0.85 var(--f-display);font-variant-numeric:tabular-nums}
.kpi-val b small{font-size:30px;margin-left:4px;color:var(--muted)}
.kpi-val .meta{font:500 16px/1 var(--f-body);color:var(--muted);margin-left:auto;text-align:right;white-space:nowrap}
.mrow{display:grid;row-gap:7px}
.mrow-top{display:flex;align-items:baseline;gap:10px}
.mrow-top .name{font:600 18px/1 var(--f-body)}
.mrow-top .name{white-space:nowrap}
.mrow-top .vals{white-space:nowrap;margin-left:auto;font:500 16px/1 var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums}
.mrow-top .pct{font:800 30px/0.8 var(--f-display);font-variant-numeric:tabular-nums;min-width:66px;text-align:right}
.pace-note{display:flex;align-items:center;gap:8px;font:500 15px/1 var(--f-body);color:var(--faint)}
.pace-note i{width:3px;height:16px;background:var(--fg);border-radius:2px;display:inline-block}

/* ---------- RH ---------- */
.rh{padding:22px 24px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto;align-content:start;row-gap:16px}
.rh-sec{display:grid;row-gap:12px;min-height:0}
.rh-sec + .rh-sec{border-top:1px solid var(--line);padding-top:16px}
.hoy-list{display:grid;row-gap:12px}
.hoy{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:18px;align-items:center;padding:12px 16px;border-radius:8px;background:radial-gradient(130% 120% at 0% 0%,var(--acc-soft),transparent 70%),var(--surface-2);border:1px solid var(--acc)}
.hoy-txt{display:grid;row-gap:5px;min-width:0}
.hoy-txt b{font:700 26px/1.05 var(--f-body)}
.hoy-txt span{font:500 18px/1.2 var(--f-body);color:var(--muted)}
.hoy-txt small{font:500 16px/1 var(--f-body);color:var(--faint);display:flex;align-items:center;gap:6px}
.av-wrap{position:relative}
.av{border-radius:50%;object-fit:cover;display:grid;place-items:center;background:var(--acc-soft);color:var(--ink);font-family:var(--f-display);font-weight:800;border:3px solid var(--line);overflow:hidden;max-width:100%}
.av.today{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}
.badge-hoy{position:absolute;right:-8px;bottom:-4px;background:var(--acc);color:var(--on-acc);font:800 15px/1 var(--f-body);letter-spacing:.1em;padding:6px 8px;border-radius:5px;display:flex;align-items:center;gap:4px}
.empty{font:500 19px/1.35 var(--f-body);color:var(--muted);padding:12px 0}
.plist{display:grid;row-gap:8px;animation:pagein .6s ease}
@keyframes pagein{from{opacity:.25;transform:translateY(6px)}to{opacity:1;transform:none}}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:14px;align-items:center;min-height:62px}
.prow-txt{display:grid;row-gap:4px;min-width:0}
.prow-txt b{font:600 21px/1.1 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow-txt span{font:500 16px/1.1 var(--f-body);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when{font:700 17px/1 var(--f-body);color:var(--ink);text-align:right;white-space:nowrap}
.when.soon{background:var(--acc-soft);padding:7px 10px;border-radius:5px}
.years{width:62px;height:62px;border-radius:8px;border:2px solid var(--acc);display:grid;place-content:center;text-align:center;color:var(--ink)}
.years b{font:900 30px/0.85 var(--f-display);font-variant-numeric:tabular-nums}
.years small{font:700 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase}
.dots{display:flex;gap:6px;margin-left:auto}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--acc)}

/* ---------- Cintilla ---------- */
.ticker{display:grid;grid-template-columns:auto minmax(0,1fr);background:var(--surface);border-top:1px solid var(--line);min-width:0}
.tk-label{display:flex;align-items:center;gap:12px;padding:0 56px 0 40px;background:var(--acc);color:var(--on-acc);font:800 26px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;clip-path:polygon(0 0,100% 0,calc(100% - 26px) 100%,0 100%)}
.tk-track{overflow:hidden;display:flex;align-items:center;-webkit-mask-image:linear-gradient(90deg,transparent,#000 50px,#000 calc(100% - 50px),transparent);mask-image:linear-gradient(90deg,transparent,#000 50px,#000 calc(100% - 50px),transparent)}
.tk-move{display:flex;white-space:nowrap;will-change:transform;animation:tk 60s linear infinite}
.tk-copy{display:flex}
.tk-item{display:flex;align-items:center;font:600 26px/1 var(--f-body);padding-right:40px}
.tk-item::before{content:"";width:12px;height:12px;background:var(--acc);transform:rotate(45deg);margin-right:40px;flex:none}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ---------- Ajustes ---------- */
.fab{position:fixed;z-index:40;right:calc(max(16px,env(safe-area-inset-right,0px)) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;box-shadow:0 6px 24px rgba(0,0,0,.35);cursor:pointer;transition:opacity .4s,transform .4s}
.fab.hide{opacity:0;transform:translateY(12px);pointer-events:none}
.cfg-back{position:fixed;z-index:45;top:0;left:0;right:0;bottom:0;background:rgba(5,8,14,.45)}
.cfg{position:fixed;z-index:50;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);color:var(--fg);border-left:1px solid var(--line);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 22px) max(22px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) 22px;
  display:grid;align-content:start;row-gap:24px;font-size:15px;animation:slidein .25s ease}
@keyframes slidein{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
.cfg-head{display:flex;align-items:center;justify-content:space-between}
.cfg-head h2{margin:0;font:800 28px/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase}
.iconbtn{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;cursor:pointer}
.cfg-sec{display:grid;row-gap:10px}

.slide.scrap{background:#cdb68e;background-image:radial-gradient(rgba(90,60,25,.16) 1px,transparent 1.6px),radial-gradient(rgba(255,245,220,.22) 1px,transparent 1.6px),linear-gradient(160deg,#dcc79f 0%,#c4a978 100%);background-size:11px 11px,17px 17px,100% 100%;background-position:0 0,5px 7px,0 0}
.slide.scrap::after{display:none}
.slide.scrap::before{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px rgba(70,45,15,.35)}
.sb-grid{position:absolute;left:34px;right:34px;top:44px;bottom:28px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:64px 30px}
.sb-ph{position:relative;background:#FBF8F1;padding:9px 9px 32px;box-shadow:0 2px 3px rgba(60,40,15,.25),0 12px 26px rgba(60,40,15,.32);transform:rotate(var(--r,0deg));min-height:0}
.sb-ph img{display:block;width:100%;height:100%;object-fit:cover;background:#2a2a2a}
.sb-ph .sb-tp{position:absolute;top:-13px;left:50%;width:92px;height:26px;margin-left:-46px;background:rgba(255,238,170,.78);transform:rotate(var(--tr,-4deg));box-shadow:0 1px 2px rgba(0,0,0,.18);z-index:2}
.sb-ph .sb-tp.c{top:-10px;left:-14px;margin-left:0;width:70px;transform:rotate(-38deg);background:rgba(190,225,240,.75)}
.sb-ph .sb-n{position:absolute;right:12px;bottom:6px;font:700 20px/1 'Caveat',cursive;color:#5b4632}
.slide.scrap.on .sb-ph{animation:sbin .75s cubic-bezier(.2,.8,.25,1.15) both;animation-delay:calc(var(--k) * 160ms)}
@keyframes sbin{from{opacity:0;transform:translateY(-26px) rotate(calc(var(--r,0deg) * 3)) scale(1.06)}to{opacity:1;transform:rotate(var(--r,0deg))}}
.sb-lab{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-2.5deg);width:max-content;max-width:52%;padding:10px 24px 11px;background:#FFF6B8;color:#2b2218;box-shadow:0 8px 22px rgba(50,30,10,.35);text-align:center;display:grid;row-gap:4px}
.sb-lab::before,.sb-lab::after{content:"";position:absolute;top:-11px;width:64px;height:22px;background:rgba(255,255,255,.62);box-shadow:0 1px 2px rgba(0,0,0,.12)}

function rgba(hex, a) { const h = hex.replace('#',''); const n = parseInt(h.length === 3 ? h.split('').map(c=>c+c).join('') : h, 16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }

/* ---------- Fecha y hora en la zona de la unidad ---------- */
const fmtCache = {};
function fmt(tz, opts, key) {
  const k = key + '|' + tz;
  if (!fmtCache[k]) { try { fmtCache[k] = new Intl.DateTimeFormat(opts.locale || 'es-MX', Object.assign({ timeZone: tz }, opts.o)); } catch (e) { fmtCache[k] = new Intl.DateTimeFormat(opts.locale || 'es-MX', opts.o); } }
  return fmtCache[k];
}
function partsInTZ(ts, tz) {
  const f = fmt(tz, { locale:'en-US', o:{ year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23' } }, 'parts');
  const o = {}; f.formatToParts(new Date(ts)).forEach(p => o[p.type] = p.value);
  return { y:+o.year, m:+o.month, d:+o.day, h:(+o.hour) % 24, mi:+o.minute, s:+o.second };
}
const DAY = 864e5;
const utc = (y, m, d) => Date.UTC(y, m - 1, d);
const cap1 = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const nf = new Intl.NumberFormat('es-MX');
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
function shortDate(ts) { const d = new Date(ts); return `${DIAS[d.getUTCDay()]} ${d.getUTCDate()} ${MESES[d.getUTCMonth()].slice(0,3)}`; }
function toMin(hhmm) { const [h, m] = String(hhmm).split(':').map(Number); return h * 60 + (m || 0); }
function turnoActual(turnos, h, mi) {
  const t = h * 60 + mi;
  return (turnos || []).find(x => { const a = toMin(x.inicio), b = toMin(x.fin); return a < b ? (t >= a && t < b) : (t >= a || t < b); });
}
function initials(n) { const p = String(n).trim().split(/\s+/); return ((p[0]||'')[0] + ((p[1]||'')[0]||'')).toUpperCase(); }
function pctOf(a, b) { return b > 0 ? (a / b) * 100 : 0; }
function tone(p) { return p >= 100 ? 'ok' : p >= 90 ? 'warn' : 'bad'; }

function saveCfg(c) { try { localStorage.setItem(CFG_KEY, JSON.stringify(c)); } catch (e) {} }

function useNow(ms) { const [n, setN] = useState(() => Date.now()); useEffect(() => { const id = setInterval(() => setN(Date.now()), ms); return () => clearInterval(id); }, [ms]); return n; }
function usePager(list, size, ms) {
  const pages = Math.max(1, Math.ceil(list.length / size));
  const [p, setP] = useState(0);
  useEffect(() => { if (pages < 2) { setP(0); return; } const id = setInterval(() => setP(x => (x + 1) % pages), ms); return () => clearInterval(id); }, [pages, ms]);
  const cur = Math.min(p, pages - 1);
  return { slice: list.slice(cur * size, cur * size + size), page: cur, pages };
}
function useMounted(delay = 60) { const [m, setM] = useState(false); useEffect(() => { const id = setTimeout(() => setM(true), delay); return () => clearTimeout(id); }, []); return m; }

function Weather({ clima, p }) {
  if (!clima || !clima.dias) return null;
  const key = `${p.y}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`;
  const i = clima.dias.findIndex(x => x.fecha === key);
  if (i < 0) return null;
  const hoy = clima.dias[i], man = clima.dias[i + 1];
  const cond = l => l >= 40 ? ['rain', 'Probable lluvia'] : l >= 20 ? ['cloud', 'Parcialmente nublado'] : ['sun', 'Despejado'];
  const [ic, txt] = cond(hoy.lluvia);
  const r = n => Math.round(n);
  return html`<div className="wx" aria-label="Clima de hoy">
    <${Icon} name=${ic} size=${44} stroke=${1.8} className="wx-ico"/>
    <div className="wx-main"><b className="num">${r(hoy.max)}°<span> / ${r(hoy.min)}°</span></b><small>${txt} · lluvia ${hoy.lluvia}%</small></div>
    ${man && html`<div className="wx-next"><small>Mañana</small><span className="num">${r(man.max)}° / ${r(man.min)}°</span></div>`}
  </div>`;
}

function fmtActualizado(v) {
  const m = /^(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})/.exec(String(v || ''));
  if (!m) return v || '—';
  const h = +m[4], ap = h < 12 ? 'a. m.' : 'p. m.', h12 = h % 12 || 12;
  return `${+m[3]} ${MESES[+m[2] - 1].slice(0, 3)} ${m[1]} · ${h12}:${m[5]} ${ap}`;
}

function Safety({ seg, today, soloContador }) {
  const t0 = utc(today.y, today.m, today.d);
  let dias = seg.diasSinIncidentes || 0;
  if (seg.fechaUltimoAccidente) { const [y, m, d] = seg.fechaUltimoAccidente.split('-').map(Number); dias = Math.max(0, Math.round((t0 - utc(y, m, d)) / DAY)); }
  const record = seg.recordDias || 0;
  const c = seg.ccrm || {};
  const tot = c.total || {};
  const pct = tot.meta ? pctOf(tot.acum, tot.meta) : 0;
  const prog = tot.pctProgramado != null ? tot.pctProgramado : (tot.plan && tot.meta ? pctOf(tot.plan, tot.meta) : 100);
  const tol = c.toleranciaAmarillo != null ? c.toleranciaAmarillo : 5;
  const estOf = p => Math.round(p) >= Math.round(prog) ? 'ok' : Math.round(p) >= Math.round(prog) - tol ? 'warn' : 'bad';
  const est = estOf(pct);
  const estTxt = { ok:'En verde', warn:'Precaución', bad:'Bajo programa' }[est];
  const brecha = Math.max(0, (tot.plan || 0) - (tot.acum || 0));
  const reglas = seg.reglasDeOro || [];
  const doy = Math.round((t0 - utc(today.y, 1, 1)) / DAY);
  const regla = seg.reglaDelDia || reglas[doy % Math.max(1, reglas.length)] || '';
  const ultimo = seg.fechaUltimoAccidente ? (() => { const [y, m, d] = seg.fechaUltimoAccidente.split('-').map(Number); return `${d} ${MESES[m-1].slice(0,3)} ${y}`; })() : null;
  return html`<section className="panel safety" aria-label="Seguridad">
    <div className="counter">
      <div className="eyebrow"><${Icon} name="shield" size=${22}/>Seguridad</div>
      <div className="big"><b>${nf.format(dias)}</b><span>DÍAS<br/>SIN<br/>AcTP</span></div>
      <div className="lbl">Días sin accidentes con tiempo perdido${ultimo ? html` · último registro ${ultimo}` : ''}</div>
      ${record > 0 && html`<div className="record">

        <${Bar} pct=${pctOf(dias, record)}/>

    </div>
    ${!soloContador && html`<div className="ccrm fadein">
      <div className="eyebrow"><${Icon} name="hardhat" size=${22}/>CCRM<span className="count">${c.corte ? 'Al ' + c.corte : ''}</span></div>
      <div className="ccrm-body">
        <div className="semaforo" aria-label=${'Semáforo ' + estTxt}><i className=${'r' + (est === 'bad' ? ' on' : '')}></i><i className=${'y' + (est === 'warn' ? ' on' : '')}></i><i className=${'g' + (est === 'ok' ? ' on' : '')}></i></div>
        <div className="ccrm-num">
          <div className="pct"><b className="num">${pct.toFixed(0)}%</b><em className=${est}>${estTxt}</em></div>
          <p className="num">${nf.format(tot.acum || 0)} de ${nf.format(tot.meta || 0)} · programado al día ${Math.round(prog)}%</p>
          <${Bar} pct=${pct} pace=${prog} cls=${est}/>
        </div>
      </div>
      <div className="ccrm-lv">
        ${(c.niveles || []).map(l => { const p = pctOf(l.acum, l.meta), e = estOf(p); return html`<div className="lv" key=${l.nombre}>
          <span className="lv-n">${l.nombre}</span>
          <${Bar} pct=${p} pace=${prog} cls=${e}/>
          <span className=${'lv-p num ' + e}>${p.toFixed(0)}%</span>
          <span className="lv-v num">${nf.format(l.acum)}/${nf.format(l.meta)}</span>
        </div>`; })}
      </div>
      <div className="ccrm-foot num"><span>Hoy <b>${nf.format(tot.dia || 0)}</b> verificaciones</span><span>Día <b>${c.diasAcumulados || '–'}</b></span>${brecha > 0 ? html`<span>Faltan <b>${nf.format(brecha)}</b> para el plan</span>` : html`<span><b>Plan cumplido</b></span>`}</div>

    </div>`}

}

const SCRAP_MIN = 6;
const SB_ROT = ['-2.6deg', '1.8deg', '-1.2deg', '2.2deg', '-1.8deg', '1.4deg'];
function armarDiapositivas(items) {
  const grupos = []; const idx = {};
  items.forEach(x => { const k = x.evento || x.id; if (!(k in idx)) { idx[k] = grupos.length; grupos.push([]); } grupos[idx[k]].push(x); });
  const out = [];
  grupos.forEach(g => {
    if (g.length < SCRAP_MIN) { g.forEach(x => out.push({ tipo: 'foto', e: x, key: x.id })); return; }
    const pags = Math.ceil(g.length / 6);
    for (let p = 0; p < pags; p++) {
      let f = g.slice(p * 6, p * 6 + 6);
      if (f.length < 6) f = f.concat(g.slice(0, 6 - f.length));
      out.push({ tipo: 'scrap', e: g[0], fotos: f, pag: p + 1, pags, total: g.length, key: (g[0].evento || g[0].id) + '-p' + p });
    }
  });
  return out;
}
function Carousel({ items, interval }) {
  const slides = useMemo(() => armarDiapositivas(items), [items]);
  const [i, setI] = useState(0);
  const prev = useRef(-1);
  const n = slides.length;
  const dur = s => (s && s.tipo === 'scrap' ? Math.round(interval * 1.8) : interval);
  useEffect(() => { if (i >= n) setI(0); }, [n]);
  useEffect(() => {
    if (n < 2) return;
    const id = setTimeout(() => { prev.current = i; setI(x => (x + 1) % n); }, dur(slides[Math.min(i, n - 1)]) * 1000);
    return () => clearTimeout(id);
  }, [i, n, interval]);
  if (!n) return html`<section className="panel carousel"><div className="ph"></div></section>`;
  const cur = Math.min(i, n - 1);
  const ivCur = dur(slides[cur]);
  const porEvento = {}; items.forEach(x => { porEvento[x.evento] = (porEvento[x.evento] || 0) + 1; });
  return html`<section className="panel carousel" aria-label="Eventos" style=${{ '--iv': ivCur + 's', '--kb': (ivCur + 1.5) + 's' }}>
    ${slides.map((s, k) => {
      const e = s.e;
      const ic = CAT_ICON[e.categoria] || 'camera';
      if (s.tipo === 'scrap') {
        const cls = 'slide scrap' + (k === cur ? ' on' : k === prev.current ? ' prev' : '');
        const desde = (s.pag - 1) * 6 + 1, hasta = Math.min(s.pag * 6, s.total);
        return html`<div key=${s.key} className=${cls} aria-hidden=${k !== cur}>
          <div className="sb-grid">${s.fotos.map((f, j) => html`<figure key=${f.id + '-' + j} className="sb-ph" style=${{ '--r': SB_ROT[j], '--k': j, '--tr': (j % 2 ? '5deg' : '-4deg'), margin: 0 }}>
            <span className=${'sb-tp' + (j === 2 || j === 3 ? ' c' : '')}></span>
            ${f.imagen ? html`<img src=${f.imagen} alt=${f.titulo} loading="lazy"/>` : html`<div className="ph"></div>`}
            <span className="sb-n">${f.foto}/${s.total}</span>
          </figure>`)}</div>
          <div className="sb-lab">
            <small><span>${e.categoria || 'Evento'}</span><span>·</span><span>${e.fecha}</span></small>
            <b>${e.titulo}</b>
            <span>${e.lugar ? e.lugar + ' · ' : ''}${s.pags > 1 ? `Fotos ${desde}–${hasta} de ${s.total}` : `${s.total} fotos`}</span>
          </div>
        </div>`;
      }
      const cls = 'slide' + (k === cur ? ' on' : k === prev.current ? ' prev' : '');
      return html`<div key=${s.key || k} className=${cls} aria-hidden=${k !== cur}>
        <div className="media">
          ${e.imagen ? html`<img src=${e.imagen} alt=${e.titulo}/>` : html`<div className="ph"><${Icon} name=${ic} size=${250} stroke=${1.1} className="ph-ico"/></div>`}
        </div>
        <div className="cap">
          <div className="cap-top">${e.categoria && html`<span className="cat"><${Icon} name=${ic} size=${15}/>${e.categoria}</span>`}<time>${e.fecha}</time></div>
          <h3>${e.titulo}</h3>
          ${e.lugar && html`<span className="cap-loc"><${Icon} name="pin" size=${15}/>${e.lugar}</span>`}
          ${e.descripcion && e.foto === 1 && html`<p>${e.descripcion}</p>`}
        </div>
        ${(porEvento[e.evento] || 0) > 1 && html`<span className="cnt num">${e.foto}/${porEvento[e.evento]}</span>`}
      </div>`;
    })}
    ${n <= 12
      ? html`<div className="segs" aria-hidden="true">${slides.map((s, k) => html`<span key=${'s' + k} className=${k < cur ? 'done' : k === cur ? 'cur' : ''}><i key=${'i' + cur}></i></span>`)}</div>`
      : html`<div className="segs" aria-hidden="true"><span className="cur"><i key=${'i' + cur}></i></span></div><div className="car-count num">${cur + 1} / ${n}</div>`}
  </section>`;
}

function Results({ res, today }) {

  const T = (k, v, u, real, plan, sub, per, pend) => { const p = pctOf(real, plan); return pend ? { k, v: '—', u: '', p: 0, t: 'pend', sub, per, pend: true } : { k, v, u, p, t: tone(p), sub, per }; };
  const extPend = d.extraccionSecas == null || (d.extraccionPendiente === true);
  const tiles = [
    T('Extracción', f0(d.extraccionSecas), 't', d.extraccionSecas, d.planExtraccion, extPend ? `Pendiente de captura · plan ${f0(d.planExtraccion)} t` : `Plan ${f0(d.planExtraccion)} t · húmedas ${f0(d.extraccionHumedas)} t`, 'Día ' + diaN, extPend),
    T('Desarrollo', f1(d.desarrollo), 'm', d.desarrollo, d.planDesarrollo, `Plan ${f1(d.planDesarrollo)} m`, 'Día ' + diaN),
    T('Extracción', f0(m.extraccionSecas), 't', m.extraccionSecas, m.planExtraccion, `Plan ${f0(m.planExtraccion)} t · ${sg(m.extraccionSecas - m.planExtraccion)}${f0(Math.abs(m.extraccionSecas - m.planExtraccion))} t${extPend ? ' · sin extracción del día ' + diaN : ''}`, mesN + ' acumulado'),
    T('Desarrollo', f1(m.desarrollo), 'm', m.desarrollo, m.planDesarrollo, `Plan ${f1(m.planDesarrollo)} m · ${sg(m.desarrollo - m.planDesarrollo)}${f1(Math.abs(m.desarrollo - m.planDesarrollo))} m`, mesN + ' acumulado'),
    d.disparosPlan ? T('Disparos', `${d.disparos} de ${d.disparosPlan}`, '', d.disparos, d.disparosPlan, `Relleno RF día ${f0(d.rellenoRF)} · mes ${f0(m.rellenoRF)} m³${(d.rellenoCRF || m.rellenoCRF) ? ' · CRF ' + f0(m.rellenoCRF) + ' m³' : ''}`, 'Día ' + diaN) : null
  ].filter(Boolean);
  return html`<section className="panel results" aria-label="Resultados operativos">
    <div className="res-head"><div className="eyebrow"><${Icon} name="pickaxe" size=${20}/>Resultados operativos</div><span className="corte num">${res.corte ? 'Corte al ' + res.corte + ' · toneladas secas · acumulado contra plan al día' : ''}</span></div>
    <div className="res-tiles">${tiles.map(x => html`<div className="rt" key=${x.k}>
      <span className="rt-k"><i>${x.per}</i>${x.k}</span>

      <${Bar} pct=${x.p} cls=${x.t}/>
      <span className="rt-m num">${x.sub}</span>
    </div>`)}</div>
  </section>`;
}

function Avatar({ p, size, today }) {

  return p.foto
    ? html`<img className=${'av' + (today ? ' today' : '')} style=${st} src=${p.foto} alt=""/>`

}
function Dots({ pages, page }) { return pages > 1 ? html`<span className="dots">${Array.from({ length: pages }, (_, k) => html`<i key=${k} className=${k === page ? 'on' : ''}></i>`)}</span>` : null; }

/* Lista que sube fila por fila: pausa para leer y luego desliza suave hacia arriba */
function VScroll({ items, visible, hold = 4500, render }) {
  const n = items.length;
  const loop = n > visible;
  const [i, setI] = useState(0);
  const [anim, setAnim] = useState(true);
  const key = items.map(p => p.id).join(',');
  useEffect(() => { setAnim(false); setI(0); }, [key]);
  useEffect(() => {
    if (!loop) return;
    if (i >= n) { const id = setTimeout(() => { setAnim(false); setI(0); }, 1300); return () => clearTimeout(id); }
    const id = setTimeout(() => { setAnim(true); setI(x => x + 1); }, i === 0 && !anim ? hold : hold);
    return () => clearTimeout(id);
  }, [i, loop, n, hold]);
  const list = loop ? items.concat(items.slice(0, visible)) : items;
  return html`<div className=${'vs' + (loop ? ' loop' : '')} style=${{ '--vis': visible }}>
    <div className="vs-track" style=${{ transform: `translateY(calc(${-i} * var(--rh)))`, transition: anim ? 'transform 1.2s cubic-bezier(.45,0,.25,1)' : 'none' }}>
      ${list.map((p, k) => html`<div className="vs-row" key=${k}>${render(p)}</div>`)}
    </div>
  </div>`;
}

}

  return html`<div className="ms" style=${{ '--ms': secs + 's' }}>
    <div className="ms-track">${items.map((p, k) => row(p, 'a' + k))}${items.map((p, k) => row(p, 'b' + k))}</div>

function People({ personal, today }) {

    let dt = utc(today.y, mm, dd); if (dt < t0) dt = utc(today.y + 1, mm, dd);
    return Object.assign({}, p, { dias: Math.round((dt - t0) / DAY), ts: dt });
  }).filter(p => p.dias <= 7).sort((a, b) => a.dias - b.dias || a.nombre.localeCompare(b.nombre)), [personal, t0]);
  const hoy = cumples.filter(p => p.dias === 0);
  const semana = cumples.filter(p => p.dias > 0);
  const delMes = useMemo(() => (personal || []).filter(p => p.cumpleanos && +p.cumpleanos.slice(0, 2) === today.m)
    .map(p => Object.assign({}, p, { dia: +p.cumpleanos.slice(3) })).sort((a, b) => a.dia - b.dia || a.nombre.localeCompare(b.nombre)), [personal, today.m]);

        </div>`)}</div>`
        : html`<div className="empty">Hoy no hay cumpleaños registrados.</div>`}
    </div>
    <div className="rh-sec mes">

/* ---------- Capacitación: habilidades por vencer ---------- */
function ymd(today) { return `${today.y}-${String(today.m).padStart(2,'0')}-${String(today.d).padStart(2,'0')}`; }
function capPendientes(cap, today) { const h = ymd(today); return ((cap && cap.activo && cap.lista) || []).filter(r => r.fecha >= h); }
function Capacitacion({ cap, today, fin }) {
  const now = useNow(1000);
  const hoy = ymd(today);
  const dias = useMemo(() => { const g = {}; capPendientes(cap, today).forEach(r => { (g[r.fecha] = g[r.fecha] || []).push(r); }); return Object.keys(g).sort().map(f => ({ f, l: g[f] })); }, [cap, hoy]);
  const n = dias.length;
  const per = Math.max(20, Math.round((cap.minCapacitacion || 4) * 60 / Math.max(1, n)));
  const [i, setI] = useState(0);
  useEffect(() => { if (n < 2) return; const id = setTimeout(() => setI(x => (x + 1) % n), per * 1000); return () => clearTimeout(id); }, [i, n, per]);
  if (!n) return null;
  const k = Math.min(i, n - 1), dia = dias[k];
  const t0 = utc(today.y, today.m, today.d);
  const etiqueta = f => { const [y, m, d] = f.split('-').map(Number); const dd = Math.round((utc(y, m, d) - t0) / DAY); return dd === 0 ? 'Hoy' : dd === 1 ? 'Mañana' : ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'][new Date(utc(y, m, d)).getUTCDay()]; };
  const corto = f => { const [y, m, d] = f.split('-').map(Number); return `${DIAS[new Date(utc(y, m, d)).getUTCDay()]} ${d}`; };
  const rest = Math.max(0, Math.round((fin - now) / 1000));
  const hayNoche = dia.l.some(r => r.cuadrilla === 'noche' && r.cambiaTurno !== false);
  return html`<section className="panel capa fadein" aria-label="Capacitación: habilidades por vencer" style=${{ '--civ': per + 's' }}>
    <div className="capa-hd">
      <div className="eyebrow"><${Icon} name="cap" size=${22}/>Capacitación<span className="count">CCRM en <b>${Math.floor(rest / 60)}:${String(rest % 60).padStart(2, '0')}</b></span></div>
      <h3>Habilidades <span>por vencer</span></h3>
      <div className="capa-meta"><span><${Icon} name="pin" size=${16}/>${cap.lugar}</span><span><${Icon} name="clock" size=${16}/>${cap.hora} h</span>${hayNoche && cap.notaNoche && html`<span className="capa-noche"><${Icon} name="moon" size=${16}/>${cap.notaNoche}</span>`}</div>
    </div>
    <div className="capa-tabs" aria-hidden="true">${dias.map((x, j) => html`<span key=${x.f} className=${j === k ? 'on' : ''}><small>${etiqueta(x.f)}</small><b>${corto(x.f)} oct</b>${j === k && n > 1 && html`<i key=${'p' + i}></i>`}</span>`)}</div>
    <div className="capa-list fadein" key=${dia.f}>
      ${dia.l.map(r => html`<div className="capa-row" key=${r.nombre + r.fecha}>
        <span className=${'cu ' + r.cuadrilla} title=${r.cuadrilla === 'noche' ? 'Cuadrilla de noche' : 'Cuadrilla de día'}><${Icon} name=${r.cuadrilla === 'noche' ? 'moon' : 'sun'} size=${24}/></span>
        <div className="tx"><b>${r.nombre}</b><div className="l2"><div className=${"habs" + (r.habilidades.length > 1 ? " dos" : "")}>${r.habilidades.map(h => html`<em key=${h}>${h}</em>`)}</div>${r.habilidades.length < 2 && html`<span>${r.puesto}</span>`}${r.hora && html`<span>${r.hora} h</span>`}</div></div>
      </div>`)}
    </div>
    <footer className="capa-ft"><${Icon} name="alert" size=${24}/><div><p>${cap.nota}</p><small>Capacitadores: ${(cap.capacitadores || []).join(' y ')}</small></div></footer>
  </section>`;
}

/* =====================================================================
   APP
   ===================================================================== */
function App() {
  const [data, setData] = useState(DATOS_RESPALDO);
  const [cfg, setCfgState] = useState(loadCfg);
  const [open, setOpen] = useState(false);
  const [active, setActive] = useState(true);
  const set = patch => setCfgState(c => { const n = Object.assign({}, c, patch); saveCfg(n); return n; });
  const meta = data.meta || {};
  const tick = useNow(30000);
  const today = partsInTZ(tick, meta.zonaHoraria);
  const autoTheme = themeForMonth(today.m);
  const byId = id => THEMES.find(t => t.id === id);
  const theme = cfg.override
    ? (cfg.auto ? autoTheme : (byId(cfg.themeId) || THEMES[0]))
    : (meta.tema === 'auto' ? autoTheme : (byId(meta.tema) || THEMES[0]));

  /* Datos: data.json publicado junto a la página */
  useEffect(() => {
    let alive = true;
    const load = () => fetch('data.json', { cache:'no-store' }).then(r => r.ok ? r.json() : null).then(j => { if (alive && j && typeof j === 'object' && j.seguridad) setData(j); }).catch(() => {});
    load(); const id = setInterval(load, 5 * 60 * 1000);
    return () => { alive = false; clearInterval(id); };
  }, []);

  /* Tema y modo */
  useLayoutEffect(() => {
    const r = document.documentElement, s = r.style;
    s.setProperty('--acc', theme.acc); s.setProperty('--acc2', theme.acc2); s.setProperty('--deep', theme.deep); s.setProperty('--inkL', theme.inkL);
    s.setProperty('--t-bg', theme.bg); s.setProperty('--t-surf', theme.surf); s.setProperty('--t-surf2', theme.surf2); s.setProperty('--t-line', theme.line);
    s.setProperty('--acc-soft', rgba(theme.acc, cfg.mode === 'light' ? .16 : .14)); s.setProperty('--acc-glow', rgba(theme.acc, .38)); s.setProperty('--deep-soft', rgba(theme.deep, .32));
    s.setProperty('--stripe', theme.stripe);
    r.setAttribute('data-mode', cfg.mode);
  }, [theme.id, cfg.mode]);

  /* Escalado del lienzo 16:9 */
  const vp = useRef(null);
  const [scale, setScale] = useState(1);
  useLayoutEffect(() => {
    const el = vp.current;
    const calc = () => {
      const cs = getComputedStyle(el);
      const w = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const h = el.clientHeight;
      const v = 1;
      setScale(v); document.documentElement.style.setProperty('--s', v);
    };
    calc(); window.addEventListener('resize', calc);
    let ro; if (window.ResizeObserver) { ro = new ResizeObserver(calc); ro.observe(el); }
    return () => { window.removeEventListener('resize', calc); if (ro) ro.disconnect(); };
  }, []);

  /* Botón de ajustes y cursor se ocultan sin actividad; pantalla siempre encendida */
  useEffect(() => {
    let t;
    const wake = () => { setActive(true); };
    const key = e => { if (e.key === 's' || e.key === 'S') setOpen(o => !o); if (e.key === 'Escape') setOpen(false); };
    ['mousemove', 'pointerdown', 'touchstart', 'keydown'].forEach(ev => window.addEventListener(ev, wake, { passive:true }));
    window.addEventListener('keydown', key);
    wake();
    let lock = null;
    const req = () => { try { if (navigator.wakeLock && document.visibilityState === 'visible') navigator.wakeLock.request('screen').then(l => { lock = l; }).catch(() => {}); } catch (e) {} };
    req(); document.addEventListener('visibilitychange', req);
    return () => { ['mousemove', 'pointerdown', 'touchstart', 'keydown'].forEach(ev => window.removeEventListener(ev, wake)); window.removeEventListener('keydown', key); document.removeEventListener('visibilitychange', req); clearTimeout(t); };
  }, []);

  /* Alternancia CCRM ↔ Capacitación (sincronizada con el reloj en todas las pantallas) */
  const cap = data.capacitacion || null;
  const tFase = useNow(1000);
  const t0Carga = useRef(Date.now());
  const [forzar, setForzar] = useState(null);
  useEffect(() => { const k = e => { if (e.key === 'c' || e.key === 'C') setForzar(f => f === null ? 'cap' : f === 'cap' ? 'ccrm' : null); }; window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, []);
  const capHay = capPendientes(cap, today).length > 0;
  const mC = ((cap && cap.minCcrm) || 5) * 60e3, mK = ((cap && cap.minCapacitacion) || 4) * 60e3, ciclo = mC + mK;
  const ancla = cap && cap.prueba ? t0Carga.current - mC : 0;
  const pos = ((tFase - ancla) % ciclo + ciclo) % ciclo;
  const alAbrir = tFase - t0Carga.current < mK; /* al abrir la página se muestra primero Capacitación */
  const capOn = capHay && (forzar ? forzar === 'cap' : (alAbrir || pos >= mC));
  const capFin = alAbrir && pos < mC ? t0Carga.current + mK : tFase + (ciclo - pos);

  /* Cintilla: avisos + cumpleaños de hoy generados */
  const tickerItems = useMemo(() => {
    const t0 = utc(today.y, today.m, today.d);
    const hoy = (data.personal || []).filter(p => { if (!p.cumpleanos) return false; const [mm, dd] = p.cumpleanos.split('-').map(Number); return mm === today.m && dd === today.d; }).map(p => p.nombre);
    const items = [].concat(data.avisosTicker || []);
    if (hoy.length) items.splice(1, 0, `Hoy celebramos el cumpleaños de ${hoy.length > 1 ? hoy.slice(0, -1).join(', ') + ' y ' + hoy[hoy.length - 1] : hoy[0]}. ¡Muchas felicidades de parte de toda la familia CoMinVi!`);
    return items;
  }, [data, today.y, today.m, today.d]);

  return html`<${React.Fragment}>
    <div className="viewport" ref=${vp}>
      <div className="stage-box">
        <div className="stage" >
          <${Header} meta=${meta} theme=${theme} pantalla=${cfg.pantalla} clima=${data.clima}/>
          <main className="main">
            <div className="col left"><${Safety} seg=${data.seguridad || {}} today=${today} soloContador=${capOn}/>${capOn ? html`<${Capacitacion} cap=${cap} today=${today} fin=${capFin}/>` : html`<${Cultura} items=${data.cultura || []}/>`}</div>
            <div className="col mid">
              <${Carousel} items=${data.eventosFotos || []} interval=${cfg.interval}/>
              <${Results} res=${data.resultados || {}} today=${today}/>
            </div>
            <div className="col right"><${People} personal=${data.personal || []} today=${today}/></div>
          </main>
          <${Ticker} items=${tickerItems}/>
        </div>
      </div>
    </div>
    <button className=${'fab' + (active || open ? '' : ' hide')} id="fab-ajustes" onClick=${() => setOpen(true)} aria-label="Abrir ajustes del tablero"><${Icon} name="sliders" size=${24}/></button>
    ${open && html`<${Settings} cfg=${cfg} set=${set} close=${() => setOpen(false)} autoTheme=${autoTheme} meta=${meta} themeId=${theme.id}/>`}
  <//>`;
}

try { ReactDOM.createRoot(document.getElementById('app')).render(html`<${App}/>`); } catch (e) { var b=document.getElementById('boot-err'); b.hidden=false; b.textContent='No se pudo iniciar el tablero: '+e.message; }
</script>
